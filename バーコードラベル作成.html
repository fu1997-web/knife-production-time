<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バーコードラベル作成</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f3f5f7;color:#17202a}header{background:#0b0f14;color:white;padding:18px}main{max-width:900px;margin:auto;padding:16px}.panel{background:white;border:1px solid #d8dee6;border-radius:12px;padding:16px;margin-bottom:14px}input,textarea,button{font:inherit;padding:10px;border:1px solid #c7d0da;border-radius:8px}textarea,input{width:100%;box-sizing:border-box;margin:6px 0 12px}button{background:#111820;color:white;font-weight:700;cursor:pointer}.labels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.label{border:1px solid #cbd2da;border-radius:8px;padding:10px;min-height:100px;break-inside:avoid}.label strong{font-size:14px}.label small{display:block;color:#56616e}.label svg{width:100%;height:48px}.muted{color:#596574;font-size:13px;line-height:1.6}@media print{header,.controls,.muted{display:none!important}body{background:white}.panel{border:0;padding:0;margin:0}.labels{grid-template-columns:repeat(3,minmax(0,1fr));gap:5mm}.label{border:1px solid #bbb;padding:3mm;min-height:25mm}.label svg{height:12mm}main{padding:0}}</style></head><body><header><h1>バーコードラベル作成</h1><div>包丁番号・ロット番号・工程番号のラベルを印刷</div></header><main><section class="panel controls"><h2>ロット番号</h2><label>ロット番号を1行に1つ入力</label><textarea id="lots" rows="3" placeholder="LOT-261012-01&#10;LOT-261012-02"></textarea><button id="generate">ラベルを作成</button> <button onclick="window.print()">印刷する</button><p class="muted">初回はインターネット接続が必要です。印刷したラベルをカメラで読み取ってください。新しいロット番号は任意の文字列で作成できますが、LOT- で始めるのがおすすめです。</p></section><section class="panel"><div id="labels" class="labels"></div></section></main><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script>
const products=[...document.querySelectorAll('#dummy')];
const knives=[
['KN003','VG10 16層 ダマスカス 三徳 130'],['KN004','VG10 16層 ダマスカス 牛刀 210'],['KN005','VG10 16層 ダマスカス ペティ 135'],['KN006','VG10 16層 ダマスカス 菜切 170'],['KN007','VG10 16層 ダマスカス 文化 190'],['KN008','VG10 16層 ダマスカス 切付ペティ 140'],['KN009','VG10 16層 ダマスカス 筋引 240'],['KN010','VG10 16層 ダマスカス 文化 170'],['KN011','VG10 黒打ち 三徳 165'],['KN012','VG10 黒打ち 三徳 130'],['KN013','VG10 黒打ち 牛刀 210'],['KN014','VG10 黒打ち ペティ 135'],['KN015','VG10 黒打ち 菜切 170'],['KN016','VG10 黒打ち 筋引 240'],['KN017','VG10 黒打ち 文化 170'],['KN018','銀3積層 16層 ダマスカス 文化 180'],['KN019','銀3積層 16層 ダマスカス 文化 210'],['KN020','銀3積層 16層 ダマスカス 切付ペティ 135'],['KN021','銀3積層 16層 ダマスカス 文化 170'],['KN022','銀3梨地 ペティ 120'],['KN023','銀3梨地 三徳 165'],['KN024','VG10 8層 三徳 170 槌目'],['KN025','VG10 8層 ペティ 135 槌目'],['KN026','VG10 67層 ダマスカス 文化 170'],['KN027','VG10 67層 ダマスカス 切付ペティ 135']];
const processes=[['PR-02','2：ベルトグラインダー（粗刃肉落とし）'],['PR-03','3：縦（刃だし）'],['PR-04','4：横（中）（刃肉落とし）'],['PR-05','5：アゴ'],['PR-06','6：バフ掛け'],['PR-07','7：お湯あらい'],['PR-08','8：検品（キズ）'],['PR-09','9：ブラスト'],['PR-10','10：水荒い'],['PR-11','11：検品（キズ）'],['PR-12','12：打刻'],['PR-13','13：小刃付'],['PR-14','14：検品（切れ味）'],['PR-15','15：柄付け'],['PR-16','16：パテ埋め']];
function addLabel(code,name,kind){const d=document.createElement('div');d.className='label';d.innerHTML=`<small>${kind}</small><strong>${name}</strong><svg></svg><small>${code}</small>`;document.querySelector('#labels').appendChild(d);if(window.JsBarcode){try{JsBarcode(d.querySelector('svg'),code,{format:'CODE128',displayValue:false,margin:0,height:42,width:1.6})}catch(e){d.querySelector('svg').outerHTML='<p>バーコード生成失敗</p>'}}else d.querySelector('svg').outerHTML='<text>ネット接続後に再読み込みしてください</text>'}
function generate(){const root=document.querySelector('#labels');root.innerHTML='';knives.forEach(x=>addLabel(x[0],x[1],'包丁番号'));(document.querySelector('#lots').value.split(/\n/).map(x=>x.trim()).filter(Boolean)).forEach(x=>addLabel(x,x,'ロット番号'));processes.forEach(x=>addLabel(x[0],x[1],'工程番号'))}
document.querySelector('#generate').onclick=generate;generate();
</script></body></html>
