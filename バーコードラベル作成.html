<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>バーコードラベル作成</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f3f5f7;color:#17202a}header{background:#0b0f14;color:white;padding:18px}main{max-width:900px;margin:auto;padding:16px}.panel{background:white;border:1px solid #d8dee6;border-radius:12px;padding:16px;margin-bottom:14px}input,textarea,button{font:inherit;padding:10px;border:1px solid #c7d0da;border-radius:8px}textarea,input{width:100%;box-sizing:border-box;margin:6px 0 12px}button{background:#111820;color:white;font-weight:700;cursor:pointer}.labels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.label{border:1px solid #cbd2da;border-radius:8px;padding:10px;min-height:100px;break-inside:avoid}.label strong{font-size:14px}.label small{display:block;color:#56616e}.label svg{width:100%;height:48px}.muted{color:#596574;font-size:13px;line-height:1.6}@media print{header,.controls,.muted{display:none!important}body{background:white}.panel{border:0;padding:0;margin:0}.labels{grid-template-columns:repeat(3,minmax(0,1fr));gap:5mm}.label{border:1px solid #bbb;padding:3mm;min-height:25mm}.label svg{height:12mm}main{padding:0}}</style></head><body><header><h1>バーコードラベル作成</h1><div>ロット番号・工程番号のラベルだけを印刷</div></header><main><section class="panel controls"><h2>ロット番号・工程番号</h2><label>ロット番号を1行に1つ入力</label><textarea id="lots" rows="5">LOT-261013-01\nLOT-261013-02\nLOT-261013-03\nLOT-261013-04\nLOT-261013-05\nLOT-261013-06\nLOT-261013-07\nLOT-261013-08\nLOT-261013-09\nLOT-261013-10\nLOT-261013-11\nLOT-261013-12\nLOT-261013-13\nLOT-261013-14\nLOT-261013-15\nLOT-261013-16\nLOT-261013-17\nLOT-261013-18\nLOT-261013-19\nLOT-261013-20\nLOT-261013-21\nLOT-261013-22\nLOT-261013-23\nLOT-261013-24\nLOT-261013-25\nLOT-261013-26\nLOT-261013-27\nLOT-261013-28\nLOT-261013-29\nLOT-261013-30</textarea><button id="generate">ラベルを作成</button> <button onclick="window.print()">印刷する</button><p class="muted">包丁名はアプリ画面で選択します。ここではロット番号と工程番号だけを作成します。初回はインターネット接続が必要です。新しいロット番号は LOT- で始めてください。</p></section><section class="panel"><div id="labels" class="labels"></div></section></main><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script>
const processes=[['PR-02','2：ベルトグラインダー（粗刃肉落とし）'],['PR-03','3：縦（刃だし）'],['PR-04','4：横（中）（刃肉落とし）'],['PR-05','5：アゴ'],['PR-06','6：バフ掛け'],['PR-07','7：お湯あらい'],['PR-08','8：検品（キズ）'],['PR-09','9：ブラスト'],['PR-10','10：水荒い'],['PR-11','11：検品（キズ）'],['PR-12','12：打刻'],['PR-13','13：小刃付'],['PR-14','14：検品（切れ味）'],['PR-15','15：柄付け'],['PR-16','16：パテ埋め']];
function addLabel(code,name,kind){const d=document.createElement('div');d.className='label';d.innerHTML=`<small>${kind}</small><strong>${name}</strong><svg></svg><small>${code}</small>`;document.querySelector('#labels').appendChild(d);if(window.JsBarcode){try{JsBarcode(d.querySelector('svg'),code,{format:'CODE128',displayValue:false,margin:0,height:42,width:1.6})}catch(e){d.querySelector('svg').outerHTML='<p>バーコード生成失敗</p>'}}else d.querySelector('svg').outerHTML='<text>ネット接続後に再読み込みしてください</text>'}
function generate(){const root=document.querySelector('#labels');root.innerHTML='';(document.querySelector('#lots').value.split(/\n/).map(x=>x.trim()).filter(Boolean)).forEach(x=>addLabel(x,x,'ロット番号'));processes.forEach(x=>addLabel(x[0],x[1],'工程番号'))}
document.querySelector('#generate').onclick=generate;generate();
</script></body></html>
